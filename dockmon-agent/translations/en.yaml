configuration:
  dockmon_url:
    name: DockMon URL
    description: Base URL of the DockMon server.
  registration_token:
    name: Registration token
    description: Fresh registration token generated by DockMon.
  timezone:
    name: Time zone
    description: Time zone passed to DockMon Agent.
  insecure_skip_verify:
    name: Skip TLS certificate verification
    description: Use only with an untrusted or self-signed certificate.
