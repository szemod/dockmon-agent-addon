name: DockMon Agent
version: "1.0.0"
slug: dockmon-agent
description: DockMon monitoring agent for Home Assistant OS
arch:
  - amd64
  - arm64
startup: services
boot: auto
host_network: true

privileged:
  - SYS_ADMIN

map:
  - docker
  - proc
  - rootfs

options:
  dockmon_url: "https://192.168.1.184:8001"
  registration_token: ""
  timezone: "Europe/Budapest"
  insecure_skip_verify: true

schema:
  dockmon_url: str
  registration_token: str
  timezone: str
  insecure_skip_verify: bool

image: "ghcr.io/darthnorse/dockmon-agent:latest"



